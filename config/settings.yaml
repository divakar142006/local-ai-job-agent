# =====================================================================
# Application Settings & Integrations Configuration
# =====================================================================
# Global settings for LLM inference, SMS notifications, and web dashboard.

# Twilio SMS Service Configuration
twilio:
  account_sid: "AC_YOUR_TWILIO_ACCOUNT_SID_HERE"
  auth_token: "YOUR_TWILIO_AUTH_TOKEN_HERE"
  from_number: "+1234567890"  # Your Twilio virtual phone number
  to_number: "+919876543210"    # Verified destination phone number to receive alerts

# Ollama Local LLM Configuration
ollama:
  model: "phi3:mini"
  base_url: "http://localhost:11434"
  temperature: 0.2
  timeout_seconds: 60

# Streamlit Web Dashboard Configuration
dashboard:
  port: 8501
  host: "localhost"
  title: "AI Job Application Agent Dashboard"

# Notification Preferences
notifications:
  sms_enabled: true
  notify_on_match: true        # Send SMS when a high match score job is found
  notify_on_apply: true        # Send SMS when an application has been submitted
  min_score_to_notify: 70      # Minimum score threshold to trigger SMS alerts
